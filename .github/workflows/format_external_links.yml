name: Check External Link Format

on:
  push:
  pull_request:

jobs:
  format-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Format external links
        run: python ./scripts/format_external_links.py --path ./docs

      - name: Fail if links were not formatted
        run: git diff --exit-code || (echo "Run 'pre-commit run --all-files' and commit the changes." && exit 1)
